trigger: none

jobs:
- job: Test_BerryPool
  displayName: 'Test SelfHostedBerryPool'
  pool:
    name: SelfHostedBerryPool
  steps:
  - task: PowerShell@2
    displayName: 'Test CDN Access'
    inputs:
      targetType: inline
      script: |
        $url = 'https://download.agent.dev.azure.com/agent/4.252.0/vsts-agent-win-x64-4.252.0.zip'
        Write-Host "Testing access to $url"
        try {
          $response = Invoke-WebRequest -Method HEAD -Uri $url -TimeoutSec 5 -UseBasicParsing
          Write-Host "✅ Access successful: $($response.StatusCode)"
        } catch {
          Write-Host "##vso[task.logissue type=warning]CDN not accessible from SelfHostedBerryPool"
          Write-Error "❌ CDN access failed."
        }

